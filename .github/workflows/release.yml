name: Release

# Pushed by scripts/release.sh. Builds the universal app and publishes a GitHub release
# with the matching CHANGELOG section as notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Check the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "v$VERSION" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != VERSION $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          ZIP="Claude-Usage-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Claude Usage.app" "dist/$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "dist/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [[ -n "$(tr -d '[:space:]' < notes.md)" ]] || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          cat >> notes.md <<EOF

          ### Install

          Download \`$ZIP\`, unzip it, and move **Claude Usage** to Applications. The build is
          ad-hoc signed, not notarized, so macOS blocks the first launch: open
          **System Settings → Privacy & Security** and click **Open Anyway**, or run
          \`xattr -dr com.apple.quarantine "/Applications/Claude Usage.app"\`.
          Universal binary (Apple silicon and Intel), macOS 15 or later.

          SHA-256: \`$SHA256\`
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$ZIP" --title "Claude Usage $VERSION" --notes-file notes.md --verify-tag
